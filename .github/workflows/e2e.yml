name: E2E
on:
  pull_request:
  workflow_dispatch:
jobs:
  playwright:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: alumas
          POSTGRES_PASSWORD: alumas
          POSTGRES_DB: alumas_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U alumas -d alumas_e2e"
          --health-interval=10s --health-timeout=5s --health-retries=5
    env:
      DATABASE_URL: postgresql://alumas:alumas@127.0.0.1:5432/alumas_e2e?schema=public
      TEST_DATABASE_URL: postgresql://alumas:alumas@127.0.0.1:5432/alumas_e2e?schema=public
      APP_URL: http://127.0.0.1:3000
      ALLOWED_ORIGINS: http://127.0.0.1:3000
      SECURITY_HASH_SALT: ci-only-not-production
      AUDIT_HASH_SALT: ci-only-not-production
      SESSION_COOKIE_SECURE: "false"
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run test:e2e:install
      - run: npm run test:e2e:prepare
      - run: npm run typecheck
      - run: npm run test:e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
