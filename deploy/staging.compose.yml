services:
  app:
    image: ${ALUMAS_IMAGE:?ALUMAS_IMAGE must be an immutable tag or digest}
    restart: unless-stopped
    env_file: [.env.staging]
    ports: ["127.0.0.1:3000:3000"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/readiness || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: alumas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      POSTGRES_DB: alumas_staging
    volumes: ["alumas_staging_db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alumas -d alumas_staging"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  alumas_staging_db:
