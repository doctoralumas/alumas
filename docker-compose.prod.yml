services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: alumas
      POSTGRES_USER: alumas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - alumas_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alumas"]
      interval: 10s
      timeout: 5s
      retries: 5
  web:
    build: .
    restart: unless-stopped
    env_file: .env.production
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
volumes:
  alumas_pg:
